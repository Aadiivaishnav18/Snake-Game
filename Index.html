<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
    <script src="game.js" defer></script>
</head>
<body>

<div class="container">

    <aside class="profile" aria-label="Player Dashboard">

        <h2>👤 Player Profile</h2>

        <div class="user-box">
            <p id="user">Loading player...</p>
        </div>

        <div class="stats" role="region" aria-live="polite">
            <p>⏱ Time: <span id="time">0</span>s</p>
            <p>🎯 Score: <span id="score">0</span></p>
            <p>🏆 High Score: <span id="highscore">0</span></p>
        </div>

        <div class="controls">
            <button type="button" class="btn-pause" id="btnPause">⏸ Pause / Resume</button>
<button type="button" class="btn-logout" id="btnLogout">🚪 Sign Out</button>        </div>

    </aside>

    <main class="game-area">
        <canvas id="board" width="400" height="400"></canvas>
    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const user = localStorage.getItem("loggedInUser");

        if (!user) {
            window.location.href = "signin.html";
        } else {
            document.getElementById("user").textContent = `Welcome, ${user}`;
        }

       
        const pauseBtn = document.getElementById("btnPause");
        const logoutBtn = document.getElementById("btnLogout");

        if (pauseBtn && typeof pauseGame === "function") pauseBtn.addEventListener("click", pauseGame);
        if (logoutBtn && typeof logout === "function") logoutBtn.addEventListener("click", logout);
    });
</script>

</body>
</html>
